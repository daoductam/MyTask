services:
  # ===== BACKEND (Spring Boot + H2) =====
  my-task-be:
    build:
      context: ./my-task-be
      dockerfile: Dockerfile
    container_name: my-task-be
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/mytask_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - JWT_SECRET=${JWT_SECRET:-MyTaskSecretKeyForJWTAuthenticationMustBeAtLeast256BitsLong2024}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CORS_ALLOWED_ORIGINS=http://160.191.243.54,http://localhost:5173
      - H2_CONSOLE_ENABLED=true
    volumes:
      - h2-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===== FRONTEND (React + Nginx) =====
  my-task-fe:
    build:
      context: ./my-task-fe
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://160.191.243.54:8081/api
    container_name: my-task-fe
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      my-task-be:
        condition: service_healthy
    networks:
      - app-network

volumes:
  h2-data:
    driver: local

networks:
  app-network:
    driver: bridge
